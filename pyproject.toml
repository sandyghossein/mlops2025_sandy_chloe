[project]
name = "ml-project"
version = "0.1.0"
description = "End-to-end MLOps project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyarrow>=22.0.0",
    "joblib>=1.5.3",
]

[project.scripts]
train = "scripts.train:main"
inference = "scripts.batch_inference:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/mlproject", "scripts"]
