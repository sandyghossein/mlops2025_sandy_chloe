version: "3.9"

services:
  app:
    build: .
    container_name: ml-project-app
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app/src
    entrypoint: ["uv", "run"]
    command: ["train"]

  mlflow:
    image: mlflow/mlflow:2.8.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
